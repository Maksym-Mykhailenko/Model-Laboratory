name: Generative inference and decision demonstration
metadata:
  description: Hidden-state inference, a finite decision model, and active-inference policies.
  tags: [official-pack, generative, active-inference]
objects:
  sensor-model:
    kind: org.modellab.generative.hidden-markov-model
    kind_version: "1.0"
    properties:
      states: [safe, risky]
      observations: [quiet, alarm]
      initial: [0.8, 0.2]
      transition: [[0.9, 0.1], [0.25, 0.75]]
      emission: [[0.95, 0.05], [0.2, 0.8]]
  maintenance-decision:
    kind: org.modellab.generative.pomdp
    kind_version: "1.0"
    properties:
      states: [healthy, degraded]
      observations: [normal, warning]
      actions: [operate, repair]
      initial: [0.8, 0.2]
      transitions:
        - [[0.85, 0.15], [0.1, 0.9]]
        - [[0.98, 0.02], [0.8, 0.2]]
      emissions: [[0.9, 0.1], [0.15, 0.85]]
      rewards: [[5, 1], [-8, -2]]
      discount: 0.95
  agent:
    kind: org.modellab.generative.active-inference-model
    kind_version: "1.0"
    properties:
      states: [safe, danger]
      observations: [calm, alarm]
      actions: [stay, intervene]
      initial: [0.7, 0.3]
      transitions:
        - [[0.9, 0.1], [0.2, 0.8]]
        - [[0.98, 0.02], [0.75, 0.25]]
      likelihood: [[0.95, 0.05], [0.1, 0.9]]
      preferences: [2, -4]
      policies:
        - {name: wait, actions: [stay, stay, stay]}
        - {name: act-now, actions: [intervene, stay, stay]}
        - {name: sustained-action, actions: [intervene, intervene, stay]}
      policy_prior: [0.4, 0.3, 0.3]
      policy_precision: 2
      likelihood_precision: 1
      events:
        - {name: danger, states: [danger]}
  causal-network:
    kind: org.modellab.graph.network
    kind_version: "1.0"
    value_type: {kind: graph}
    properties:
      nodes: [state, action, observation, preference]
      directed: true
      edges:
        - {source: state, target: observation}
        - {source: action, target: state}
        - {source: preference, target: action}
