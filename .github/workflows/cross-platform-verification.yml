name: Cross-platform reproducibility

on:
  workflow_dispatch:
  push:
    paths:
      - "model_lab/**"
      - "tests/**"
      - "frontend/**"
      - "desktop_engine.py"
      - "verification/run_cross_platform_campaign.py"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "constraints-tested.txt"
      - "package.json"
      - "package-lock.json"
      - "src-tauri/**"
      - "scripts/verify_native_interpreter.ps1"
      - "scripts/verify_native_interpreter.sh"

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
            artifact: linux-x86_64-py311
          - os: ubuntu-latest
            python: "3.12"
            artifact: linux-x86_64-py312
          - os: ubuntu-latest
            python: "3.13"
            artifact: linux-x86_64-py313
          - os: windows-latest
            python: "3.12"
            artifact: windows-x86_64-py312
          - os: macos-14
            python: "3.12"
            artifact: macos-arm64-py312
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt -c constraints-tested.txt
      - run: python -m pytest -q
      - name: Record real reproduction evidence
        run: python verification/run_cross_platform_campaign.py --output compatibility-observation.json
      - name: Upload runner evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: compatibility-observation.json
          if-no-files-found: error

  frontend-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run test:frontend

  native-interpreter:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - name: Install the Rust MSVC toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal
          rustup default stable-x86_64-pc-windows-msvc
      - run: python -m pip install -r requirements-dev.txt -c constraints-tested.txt
      - run: npm ci
      - name: Compile and test native interpreter bridge
        shell: pwsh
        run: ./scripts/verify_native_interpreter.ps1

  publish-matrix:
    if: always()
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt -c constraints-tested.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: "*-py*"
          path: observations
          merge-multiple: true
      - name: Merge without inferring missing evidence
        run: >-
          python verification/run_cross_platform_campaign.py
          --merge observations/*.json
          --report-json compatibility-matrix.json
          --report-markdown COMPATIBILITY_MATRIX.md
      - name: Upload compatibility matrix
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compatibility-matrix
          path: |
            compatibility-matrix.json
            COMPATIBILITY_MATRIX.md
          if-no-files-found: error
