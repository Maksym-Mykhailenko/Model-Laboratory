name: Windows installer release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows-installers:
    runs-on: windows-latest
    outputs:
      signed: ${{ steps.release-evidence.outputs.signed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - name: Install the Rust MSVC toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal
          rustup default stable-x86_64-pc-windows-msvc

      - name: Verify release tag and metadata
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: python scripts/verify_release_version.py --expected-version "$env:GITHUB_REF"

      - name: Import Authenticode certificate when configured
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $HasCertificate = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)
          $HasPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)
          if ($HasCertificate -ne $HasPassword) {
            throw "WINDOWS_CERTIFICATE_BASE64 and WINDOWS_CERTIFICATE_PASSWORD must be configured together."
          }
          if (-not $HasCertificate) {
            "MODEL_LAB_INSTALLERS_SIGNED=false" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Warning "No signing certificate configured; the installers and draft release will be explicitly unsigned."
            exit 0
          }
          $CertificatePath = Join-Path $env:RUNNER_TEMP "model-laboratory-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($CertificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
            $Password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $Imported = @(Import-PfxCertificate -FilePath $CertificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $Password)
            $SigningCertificate = $Imported | Where-Object HasPrivateKey | Select-Object -First 1
            if (-not $SigningCertificate.Thumbprint) { throw "The Authenticode certificate with its private key could not be imported." }
            "MODEL_LAB_CERTIFICATE_THUMBPRINT=$($SigningCertificate.Thumbprint)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
            "MODEL_LAB_INSTALLERS_SIGNED=true" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          } finally {
            Remove-Item $CertificatePath -Force -ErrorAction SilentlyContinue
          }

      - name: Discover previous NSIS release for upgrade smoke test
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $CurrentVersion = (Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          $CurrentTag = "v$CurrentVersion"
          $Releases = @(gh release list --limit 50 --json tagName,isDraft,isPrerelease,publishedAt | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Could not query earlier releases; the clean-install tests will still run."
            exit 0
          }
          $Previous = $Releases |
            Where-Object { -not $_.isDraft -and $_.tagName -ne $CurrentTag } |
            Sort-Object { [DateTime]$_.publishedAt } -Descending |
            Select-Object -First 1
          if (-not $Previous) {
            Write-Warning "No earlier published release is available for an upgrade test."
            exit 0
          }
          $Destination = Join-Path $env:RUNNER_TEMP "previous-model-laboratory-release"
          New-Item -ItemType Directory -Path $Destination -Force | Out-Null
          gh release download $Previous.tagName --pattern "*.exe" --dir $Destination
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Release $($Previous.tagName) has no downloadable NSIS executable; upgrade testing will be recorded as NOT_RUN."
            exit 0
          }
          $PreviousInstaller = Get-ChildItem $Destination -Filter "*.exe" -File |
            Where-Object { $_.Name -match '(?i)(setup|nsis)' } |
            Sort-Object Name |
            Select-Object -First 1
          if (-not $PreviousInstaller) {
            Write-Warning "No previous NSIS installer was found after downloading $($Previous.tagName)."
            exit 0
          }
          "MODEL_LAB_PREVIOUS_NSIS=$($PreviousInstaller.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Upgrade smoke test will use $($Previous.tagName): $($PreviousInstaller.Name)"

      - name: Test and build NSIS and MSI installers
        shell: pwsh
        run: |
          $Parameters = @{ RunInstallerSmoke = $true }
          if ($env:MODEL_LAB_CERTIFICATE_THUMBPRINT) {
            $Parameters.CertificateThumbprint = $env:MODEL_LAB_CERTIFICATE_THUMBPRINT
            $Parameters.RequireSigned = $true
          }
          if ($env:MODEL_LAB_PREVIOUS_NSIS) {
            $Parameters.PreviousNsisInstaller = $env:MODEL_LAB_PREVIOUS_NSIS
          }
          ./scripts/build_windows.ps1 @Parameters

      - name: Record release signing status
        id: release-evidence
        shell: pwsh
        run: '"signed=$env:MODEL_LAB_INSTALLERS_SIGNED" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append'

      - name: Upload verified installer artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: model-laboratory-windows-${{ github.run_number }}
          path: src-tauri/target/release/bundle/release-assets/*
          if-no-files-found: error

      - name: Upload installer smoke evidence after failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: model-laboratory-windows-smoke-failure-${{ github.run_number }}
          path: src-tauri/target/release/bundle/INSTALLER_SMOKE_TEST.json
          if-no-files-found: warn

  publish-windows-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows-installers
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: model-laboratory-windows-${{ github.run_number }}
          path: release-assets
      - name: Create or update draft GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLERS_SIGNED: ${{ needs.build-windows-installers.outputs.signed }}
        run: |
          $ErrorActionPreference = "Stop"
          $Files = @(Get-ChildItem "release-assets" -File | ForEach-Object FullName)
          $ChecksumPath = Join-Path "release-assets" "SHA256SUMS.txt"
          foreach ($Line in Get-Content -LiteralPath $ChecksumPath) {
            $Parts = $Line -split '  ', 2
            $FilePath = Join-Path "release-assets" $Parts[1]
            $Actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $FilePath).Hash.ToLowerInvariant()
            if ($Actual -ne $Parts[0]) { throw "Downloaded release artifact checksum mismatch: $FilePath" }
          }
          $Version = $env:GITHUB_REF_NAME.Substring(1)
          $Notes = "docs/releases/RELEASE_NOTES_$Version.md"
          $Release = gh release view $env:GITHUB_REF_NAME --json isDraft
          if ($LASTEXITCODE -eq 0) {
            if (-not ($Release | ConvertFrom-Json).isDraft) {
              throw "Refusing to replace installers in an already published release. Use a new patch tag."
            }
            gh release upload $env:GITHUB_REF_NAME --clobber @Files
          } else {
            $Arguments = @("release", "create", $env:GITHUB_REF_NAME, "--draft", "--verify-tag", "--notes-file", $Notes, "--title", "Model Laboratory $env:GITHUB_REF_NAME")
            if ($env:INSTALLERS_SIGNED -ne "true") {
              $SigningNote = @'
          > [!WARNING]
          > The Windows installers attached to this release are not Authenticode-signed. Windows may display an **Unknown publisher** or SmartScreen warning. Verify each download against `SHA256SUMS.txt` before installation.
          '@
              $NotesText = (Get-Content -LiteralPath $Notes -Raw) + "`n`n" + $SigningNote
              $Notes = Join-Path $env:RUNNER_TEMP "release-notes.md"
              [IO.File]::WriteAllText($Notes, $NotesText)
              $Arguments[6] = $Notes
            }
            if ($env:GITHUB_REF_NAME.Contains("-")) { $Arguments += "--prerelease" }
            & gh @Arguments @Files
          }
          if ($LASTEXITCODE -ne 0) { throw "Could not create or update the draft GitHub release." }
